services:
  postgres:
    image: postgres:16
    container_name: factory_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: factory
      POSTGRES_USER: factory_user
      POSTGRES_PASSWORD: factory_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory_user -d factory"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: ./backend
    container_name: factory_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env.docker
    ports:
      - "8000:8000"
    volumes:
      - ./backend/static:/app/static
    command: >
      sh -c "alembic upgrade head && python scripts/seed.py && uvicorn main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    container_name: factory_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
